packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

# Security overrides for transitive dependencies whose direct parent pins a
# vulnerable version. Remove an entry once the parent ships a fixed range.
overrides:
  # vinext 1.0.0-beta.2 pins image-size 2.0.2 (HIGH: DoS in ICNS/JXL/HEIF parsers,
  # fixed in 2.0.3). vinext 1.0.1 drops it, but its build output imports
  # `cloudflare:workers`, which breaks tests/rendered-html.test.mjs under Node.
  image-size: 2.0.4
