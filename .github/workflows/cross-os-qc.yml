name: Cross OS Smoke QC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "github-pages/**"
      - "public/**"
      - "scripts/qc-static-server.mjs"
      - "tests/e2e/platform-smoke.spec.ts"
      - "playwright.platform.config.ts"
      - ".github/workflows/cross-os-qc.yml"

permissions:
  contents: read

concurrency:
  group: cross-os-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: windows-latest
            browser: chromium
          - os: windows-latest
            browser: firefox
          - os: macos-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - name: Install Playwright runtime
        run: pnpm add -D --ignore-scripts @playwright/test@1.55.0
      - name: Install selected browser
        run: pnpm exec playwright install ${{ matrix.browser }}
      - name: Run OS/browser smoke
        env:
          QC_BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright test --config=playwright.platform.config.ts
