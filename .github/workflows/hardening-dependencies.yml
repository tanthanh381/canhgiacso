name: Hardening dependency update

on:
  push:
    branches: [security/hardening-90]
    paths:
      - .github/workflows/hardening-dependencies.yml

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v6
        with:
          ref: security/hardening-90
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Upgrade vulnerable dependencies
        run: pnpm up react@19.2.8 react-dom@19.2.8 react-server-dom-webpack@19.2.8 vite@8.0.16 --save-exact
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm test
      - name: Commit verified dependency updates to hardening branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m 'fix: patch vulnerable React and Vite dependencies'
          git push origin HEAD:security/hardening-90
