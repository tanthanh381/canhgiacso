name: Fix guest certificate completion flow

on:
  push:
    branches:
      - feature/training-certificates
    paths:
      - scripts/fix-guest-certificate-flow.py
      - tests/certificate-source.test.mjs
      - .github/workflows/fix-guest-certificate-flow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/training-certificates
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply completion fix
        run: python3 scripts/fix-guest-certificate-flow.py
      - name: Build GitHub Pages
        run: pnpm run build:pages
      - name: Run full test suite
        run: pnpm test
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/certificate.ts tests/certificate-source.test.mjs tests/guest-certificate-flow.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "fix: show PDF certificate when training is complete"
          git push origin HEAD:feature/training-certificates
