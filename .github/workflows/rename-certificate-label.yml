name: Rename certificate terminology

on:
  push:
    branches: [main]
    paths:
      - scripts/rename-certificate-label.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply terminology update
        run: python3 scripts/rename-certificate-label.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/admin.tsx app/certificate.ts app/data.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: rename certificate wording to chung nhan"
          git push origin HEAD:main
