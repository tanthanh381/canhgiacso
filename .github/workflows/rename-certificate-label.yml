name: Verify certificate terminology

on:
  pull_request:
    branches: [main]
    paths:
      - app/**
      - scripts/rename-certificate-label.py
      - .github/workflows/rename-certificate-label.yml
  push:
    branches: [main]
    paths:
      - app/**
      - scripts/rename-certificate-label.py
      - .github/workflows/rename-certificate-label.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply terminology transformation in working tree
        run: python3 scripts/rename-certificate-label.py
      - name: Ensure repository already contains the transformed result
        run: git diff --exit-code -- app/page.tsx app/admin.tsx app/certificate.ts app/data.ts
