name: Patch security dependencies

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install current dependency tree
        run: pnpm install --frozen-lockfile
      - name: Patch React and Vite security releases
        run: pnpm up react@19.2.8 react-dom@19.2.8 react-server-dom-webpack@19.2.8 vite@8.0.16 --save-exact
      - name: Lint
        run: pnpm run lint
      - name: Build static production target
        run: pnpm run build:pages
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Audit High and Critical vulnerabilities
        run: pnpm audit --audit-level high
      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m 'fix: patch React and Vite security advisories'
          git push origin HEAD:${{ github.head_ref }}
