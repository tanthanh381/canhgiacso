name: Apply training certificate feature

on:
  push:
    branches:
      - feature/training-certificate-pdf
    paths:
      - scripts/apply-certificate-feature.py
      - .github/workflows/apply-training-certificate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/training-certificate-pdf
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply certificate UI patch
        run: python3 scripts/apply-certificate-feature.py
      - name: Build GitHub Pages
        run: pnpm run build:pages
      - name: Run full tests
        run: pnpm test
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: issue downloadable PDF training certificates"
          git push origin HEAD:feature/training-certificate-pdf
