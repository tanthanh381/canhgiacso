name: Full QC 2026-09-10

on:
  push:
    branches: [qc/full-site-2026-09-10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Full regression tests
        run: pnpm test
      - name: Build GitHub Pages
        run: pnpm run build:pages
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level moderate
      - name: Static release checks
        shell: bash
        run: |
          test -f docs/index.html
          test -d docs/assets
          ! grep -R -E 'sb_secret_|service_role' docs/assets --include='*.js'
          grep -q '>Tình huống</button>' app/page.tsx
          grep -q '>Thực hành tương tác</button>' app/page.tsx
          grep -q 'referrerPolicy="no-referrer"' app/page.tsx
          grep -q 'sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox"' app/page.tsx
