name: Rename quiz navigation label

on:
  push:
    branches:
      - feature/standalone-phishing-quiz-temp
    paths:
      - scripts/rename-quiz-nav.py
      - .github/workflows/rename-quiz-nav.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/standalone-phishing-quiz-temp
          fetch-depth: 0
      - name: Apply rename
        run: python3 scripts/rename-quiz-nav.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "feat: rename quiz navigation label"
          git push origin HEAD:feature/standalone-phishing-quiz-temp
