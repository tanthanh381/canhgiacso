name: Rename quiz navigation label

on:
  push:
    branches:
      - main
    paths:
      - scripts/rename-quiz-nav.py
      - .github/workflows/rename-quiz-nav.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply rename
        run: python3 scripts/rename-quiz-nav.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "feat: rename quiz to interactive practice"
          git push origin HEAD:main
