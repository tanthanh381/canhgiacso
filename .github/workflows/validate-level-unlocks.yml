name: Validate level unlock progression

on:
  push:
    branches:
      - feature/level-unlocks
    paths:
      - app/**
      - tests/**
      - supabase/secure_gameplay.sql
      - .github/workflows/validate-level-unlocks.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build GitHub Pages bundle
        run: pnpm run build:pages
      - name: Run full test suite
        run: pnpm test
