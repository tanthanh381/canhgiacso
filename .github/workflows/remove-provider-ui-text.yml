name: Verify provider UI text

on:
  pull_request:
    branches: [main]
    paths:
      - app/**
      - scripts/remove-provider-ui-text.mjs
      - .github/workflows/remove-provider-ui-text.yml
  push:
    branches: [main]
    paths:
      - app/**
      - scripts/remove-provider-ui-text.mjs
      - .github/workflows/remove-provider-ui-text.yml

permissions:
  contents: read

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify provider name is not user-visible
        run: |
          ! grep -q 'Supabase chỉ được dùng' app/page.tsx
          ! grep -q 'setAuthError(error?.message' app/page.tsx
      - name: Build GitHub Pages target
        run: pnpm run build:pages
      - name: Run regression tests
        run: node --test tests/*.test.mjs
