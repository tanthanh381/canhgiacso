name: Remove provider UI text

on:
  push:
    paths:
      - scripts/remove-provider-ui-text.mjs
      - .github/workflows/remove-provider-ui-text.yml

permissions:
  contents: write

jobs:
  sanitize-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply UI sanitization
        run: node scripts/remove-provider-ui-text.mjs
      - name: Verify provider name is not user-visible
        run: |
          ! grep -q 'Supabase chỉ được dùng' app/page.tsx
          ! grep -q 'setAuthError(error?.message' app/page.tsx
      - run: pnpm run build:pages
      - run: pnpm test
      - name: Commit sanitized UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet || git commit -m 'fix: remove backend provider details from UI'
          git push origin HEAD:main
