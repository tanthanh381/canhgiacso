name: Apply level unlock progression

on:
  push:
    branches:
      - feature/level-unlocks
    paths:
      - scripts/apply-level-unlocks.py
      - .github/workflows/apply-level-unlocks.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/level-unlocks
          fetch-depth: 0

      - name: Apply progression patch
        run: python3 scripts/apply-level-unlocks.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css app/progression.ts supabase/secure_gameplay.sql tests/progression-source.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: enforce challenge level unlock progression"
          git push origin HEAD:feature/level-unlocks
