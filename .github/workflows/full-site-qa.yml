name: Full site QA

on:
  push:
    branches:
      - qa/full-site-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - TypeScript
          - ESLint
          - Dependency audit
          - Regression suite
          - Pages build
          - Static release checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -uo pipefail
          : > /tmp/qa-diagnostics.txt
          case "$CHECK" in
            "TypeScript")
              pnpm exec tsc --noEmit 2>&1 | tee /tmp/qa-diagnostics.txt
              ;;
            "ESLint")
              pnpm lint 2>&1 | tee /tmp/qa-diagnostics.txt
              ;;
            "Dependency audit")
              pnpm audit --prod --audit-level moderate 2>&1 | tee /tmp/qa-diagnostics.txt
              ;;
            "Regression suite")
              pnpm test 2>&1 | tee /tmp/qa-diagnostics.txt
              ;;
            "Pages build")
              pnpm run build:pages 2>&1 | tee /tmp/qa-diagnostics.txt
              ;;
            "Static release checks")
              {
                set -euo pipefail
                pnpm run build:pages
                test -s docs/index.html
                test -s docs/khien-so-logo.png
                grep -F 'https://canhgiacso.com/' github-pages/index.html
                grep -F 'Tình huống' app/page.tsx
                grep -F 'Thực hành tương tác' app/page.tsx
                ! grep -F '>Mô phỏng<' app/page.tsx
                ! grep -F '>Trắc nghiệm<' app/page.tsx
                ! grep -E 'service_role|sb_secret_' app/supabase.ts app/page.tsx
                js_bytes=$(find docs/assets -type f -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
                echo "Total JS bytes: ${js_bytes}"
                test "${js_bytes}" -lt 900000
              } 2>&1 | tee /tmp/qa-diagnostics.txt
              ;;
            *)
              echo "Unknown QA check: $CHECK" | tee /tmp/qa-diagnostics.txt >&2
              exit 2
              ;;
          esac

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ strategy.job-index }}-${{ matrix.check }}
          path: /tmp/qa-diagnostics.txt
          if-no-files-found: warn

  live-smoke:
    name: Live production smoke
    runs-on: ubuntu-latest
    steps:
      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 -o /tmp/site.html https://canhgiacso.com/
          test -s /tmp/site.html
          curl --fail --silent --show-error --location --max-time 20 -o /tmp/logo.png https://canhgiacso.com/khien-so-logo.png
          test -s /tmp/logo.png
          curl --fail --silent --show-error --location --max-time 20 -o /tmp/quiz.html 'https://phishingquiz.withgoogle.com/?hl=vi'
          test -s /tmp/quiz.html
