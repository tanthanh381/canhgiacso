name: Validate standalone phishing quiz

on:
  push:
    branches:
      - feature/standalone-phishing-quiz
    paths:
      - scripts/split-phishing-quiz.py
      - .github/workflows/validate-standalone-phishing-quiz.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/standalone-phishing-quiz
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply standalone quiz patch
        run: python3 scripts/split-phishing-quiz.py
      - name: Build GitHub Pages
        run: pnpm run build:pages
      - name: Run full test suite
        run: pnpm test
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css tests/phishing-quiz-standalone.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: make phishing quiz standalone"
          git push origin HEAD:feature/standalone-phishing-quiz
